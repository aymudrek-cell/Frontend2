<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع طلبك | مؤسسة أريج الشام للسياحة والسفر</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .track-page{ padding-top:150px; padding-bottom:120px; min-height:100vh; background:var(--sand-2); }
  .track-box{ max-width:560px; margin:0 auto; }
  .track-search{ display:flex; gap:10px; background:var(--white); padding:8px; border-radius:10px; border:1px solid var(--line); box-shadow:var(--shadow-sm); }
  .track-search input{ flex:1; border:none; padding:12px 16px; font-family:inherit; font-size:15px; background:transparent; }
  .track-search input:focus{ outline:none; }
  .result-card{ display:none; background:var(--white); border-radius:12px; padding:32px; margin-top:30px; border:1px solid var(--line); }
  .result-card .tn{ font-family:'Amiri',serif; font-size:22px; color:var(--ink); margin-bottom:6px; }
  .timeline{ margin-top:26px; display:flex; flex-direction:column; gap:0; }
  .tl-step{ display:flex; gap:14px; position:relative; padding-bottom:28px; }
  .tl-step:last-child{ padding-bottom:0; }
  .tl-dot{ width:14px; height:14px; border-radius:50%; background:var(--line); flex-shrink:0; margin-top:4px; position:relative; z-index:1; }
  .tl-step.active .tl-dot{ background:var(--gold); }
  .tl-step:not(:last-child)::before{ content:""; position:absolute; right:6.5px; top:16px; bottom:0; width:1.5px; background:var(--line); }
  .tl-label{ font-size:14.5px; font-weight:600; }
  .tl-step.active .tl-label{ color:var(--ink); }
  .not-found{ display:none; margin-top:24px; text-align:center; color:var(--rust); background:#FBE7E5; padding:16px; border-radius:8px; }
</style>
</head>
<body>

<header class="site-header scrolled">
  <div class="container header-inner">
    <a href="../index.html" class="logo"><span class="stamp-mini">✈</span> أريج الشام</a>
    <nav class="nav-links">
      <a href="../index.html" data-i18n="nav_home">الرئيسية</a>
      <a href="services.html" data-i18n="nav_services">خدماتنا</a>
      <a href="visa-request.html" data-i18n="nav_visa">التأشيرات</a>
      <a href="contact.html" data-i18n="nav_contact">تواصل معنا</a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle">English</button>
      <button class="nav-toggle" aria-label="القائمة">☰</button>
    </div>
  </div>
</header>

<section class="track-page">
  <div class="container track-box">
    <div class="section-head" style="text-align:center; margin:0 auto 30px;">
      <span class="eyebrow" style="justify-content:center;">تتبع الطلب</span>
      <h1 style="font-size:30px;">اعرف حالة طلبك الآن</h1>
      <p>أدخل رقم الطلب الذي استلمته بعد التقديم</p>
    </div>

    <div class="track-search">
      <input type="text" id="trackInput" placeholder="مثال: TRV-2026-00123">
      <button class="btn btn-gold" id="trackBtn">تحقق</button>
    </div>

    <div class="not-found" id="notFound">لا يوجد طلب مسجّل بهذا الرقم. تأكد من الرقم وحاول مجددًا.</div>

    <div class="result-card" id="resultCard">
      <span class="status-badge" id="statusBadge"></span>
      <div class="tn" id="resultTracking" style="margin-top:14px;"></div>
      <p style="color:var(--muted); font-size:13.5px;" id="resultMeta"></p>

      <div class="timeline" id="timeline"></div>

      <div id="adminNoteBox" style="display:none; margin-top:22px; background:var(--sand); padding:16px; border-radius:8px; font-size:14px;"></div>
    </div>
  </div>
</section>

<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script>
  const API_BASE = window.location.origin.includes('4000') ? '' : 'http://localhost:4000';

  const STATUS_ORDER = ['new', 'review', 'waiting', 'done'];
  const STATUS_LABELS = { new: 'جديد', review: 'قيد الدراسة', waiting: 'بانتظار العميل', done: 'مكتمل', rejected: 'مرفوض' };
  const STATUS_CLASS = { new: 'status-new', review: 'status-review', waiting: 'status-waiting', done: 'status-done', rejected: 'status-rejected' };

  async function doTrack() {
    const value = document.getElementById('trackInput').value.trim();
    const notFound = document.getElementById('notFound');
    const resultCard = document.getElementById('resultCard');
    notFound.style.display = 'none';
    resultCard.style.display = 'none';
    if (!value) return;

    try {
      const res = await fetch(`${API_BASE}/api/visa-requests/track/${encodeURIComponent(value)}`);
      if (!res.ok) { notFound.style.display = 'block'; return; }
      const data = await res.json();

      document.getElementById('statusBadge').className = `status-badge ${STATUS_CLASS[data.status] || ''}`;
      document.getElementById('statusBadge').textContent = STATUS_LABELS[data.status] || data.status;
      document.getElementById('resultTracking').textContent = data.tracking_number;
      document.getElementById('resultMeta').textContent =
        `${data.visa_type} — ${data.destination_country} — تاريخ التقديم: ${new Date(data.created_at).toLocaleDateString('ar')}`;

      const timeline = document.getElementById('timeline');
      if (data.status === 'rejected') {
        timeline.innerHTML = `<div class="tl-step active"><div class="tl-dot" style="background:#B23A2C;"></div><div class="tl-label">تم رفض الطلب</div></div>`;
      } else {
        const currentIdx = STATUS_ORDER.indexOf(data.status);
        timeline.innerHTML = STATUS_ORDER.map((s, i) => `
          <div class="tl-step ${i <= currentIdx ? 'active' : ''}">
            <div class="tl-dot"></div><div class="tl-label">${STATUS_LABELS[s]}</div>
          </div>
        `).join('');
      }

      const noteBox = document.getElementById('adminNoteBox');
      if (data.admin_note) {
        noteBox.style.display = 'block';
        noteBox.textContent = `ملاحظة من فريقنا: ${data.admin_note}`;
      } else {
        noteBox.style.display = 'none';
      }

      resultCard.style.display = 'block';
    } catch (err) {
      notFound.textContent = 'تعذّر الاتصال بالسيرفر. تأكد أن الباك اند يعمل ثم حاول مجددًا.';
      notFound.style.display = 'block';
    }
  }

  document.getElementById('trackBtn').addEventListener('click', doTrack);
  document.getElementById('trackInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doTrack(); });

  // إذا وصل المستخدم برقم بالرابط ?n=TRV-... يتحقق تلقائيًا
  const params = new URLSearchParams(window.location.search);
  if (params.get('n')) {
    document.getElementById('trackInput').value = params.get('n');
    doTrack();
  }
</script>
</body>
</html>
