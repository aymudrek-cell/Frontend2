<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الإدارة | أريج الشام</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body{ background: var(--sand-2); }
  .admin-shell{ display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  @media(max-width:820px){ .admin-shell{ grid-template-columns:1fr; } }
  .admin-sidebar{ background:var(--ink); color:var(--sand); padding:30px 20px; }
  .admin-sidebar .logo{ margin-bottom:40px; }
  .admin-sidebar nav a{ display:block; padding:12px 14px; border-radius:6px; font-size:14.5px; margin-bottom:4px; color:rgba(237,230,212,.8); }
  .admin-sidebar nav a.active, .admin-sidebar nav a:hover{ background:rgba(255,255,255,.08); color:var(--white); }
  .admin-main{ padding:34px 34px 60px; }
  .admin-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:14px; }
  .stat-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px; }
  @media(max-width:760px){ .stat-cards{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--white); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .stat-card .n{ font-family:'Amiri',serif; font-size:28px; color:var(--ink); }
  .stat-card .l{ color:var(--muted); font-size:13px; margin-top:4px; }
  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
  .toolbar input, .toolbar select{ padding:10px 14px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:14px; background:var(--white); }
  table{ width:100%; border-collapse:collapse; background:var(--white); border-radius:10px; overflow:hidden; }
  th, td{ padding:13px 14px; text-align:right; font-size:13.5px; border-bottom:1px solid var(--line); }
  th{ background:var(--sand); color:var(--ink); font-weight:700; }
  tr:hover td{ background:#FAF8F2; }
  tr.clickable{ cursor:pointer; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  /* نافذة التفاصيل */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(11,37,64,.55); z-index:300; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--white); border-radius:12px; max-width:640px; width:100%; max-height:88vh; overflow-y:auto; padding:32px; }
  .modal-box h3{ margin-bottom:18px; }
  .detail-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .detail-row .k{ color:var(--muted); }
  .file-links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .file-links a{ font-size:13px; background:var(--sand); padding:8px 14px; border-radius:6px; color:var(--ink); font-weight:600; }
  .modal-close{ float:left; background:none; border:none; font-size:22px; color:var(--muted); }
</style>
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="logo"><span class="stamp-mini">✈</span> لوحة الإدارة</div>
    <nav>
      <a href="#" class="active">طلبات التأشيرة</a>
      <a href="../index.html" target="_blank">عرض الموقع ↗</a>
      <a href="#" id="settingsBtn">تغيير بيانات الدخول</a>
      <a href="#" id="logoutBtn">تسجيل الخروج</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h2 style="font-size:22px;">طلبات التأشيرة</h2>
        <p style="color:var(--muted); font-size:13.5px;">مرحبًا، <span id="adminName">—</span></p>
      </div>
      <div style="display:flex; gap:10px;">
        <a href="#" id="exportExcel" class="btn btn-dark" style="padding:10px 18px; font-size:13px;">تصدير Excel</a>
        <a href="#" id="exportPdf" class="btn btn-outline" style="padding:10px 18px; font-size:13px; color:var(--ink); border-color:var(--ink);">تصدير PDF</a>
      </div>
    </div>

    <div class="stat-cards">
      <div class="stat-card"><div class="n" id="statTotal">0</div><div class="l">إجمالي الطلبات</div></div>
      <div class="stat-card"><div class="n" id="statNew">0</div><div class="l">طلبات جديدة</div></div>
      <div class="stat-card"><div class="n" id="statDone">0</div><div class="l">طلبات مكتملة</div></div>
      <div class="stat-card"><div class="n" id="statVisits">0</div><div class="l">عدد الزيارات</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="ابحث بالاسم، رقم الطلب، الهاتف أو البريد...">
      <select id="statusFilter">
        <option value="">كل الحالات</option>
        <option value="new">جديد</option>
        <option value="review">قيد الدراسة</option>
        <option value="waiting">بانتظار العميل</option>
        <option value="done">مكتمل</option>
        <option value="rejected">مرفوض</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>رقم الطلب</th><th>الاسم</th><th>الدولة</th><th>نوع الفيزا</th><th>تاريخ التقديم</th><th>الحالة</th>
        </tr>
      </thead>
      <tbody id="requestsBody">
        <tr><td colspan="6" class="empty-state">جارٍ التحميل...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<!-- نافذة تفاصيل الطلب -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <h3>تفاصيل الطلب</h3>
    <div id="modalBody"></div>
  </div>
</div>

<!-- نافذة تغيير بيانات الدخول -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal-box" style="max-width:440px;">
    <button class="modal-close" id="settingsClose">×</button>
    <h3>تغيير بيانات الدخول</h3>
    <div class="err" id="settingsErr" style="display:none; background:#FBE7E5; color:#B23A2C; padding:10px 14px; border-radius:6px; font-size:13.5px; margin-bottom:16px;"></div>
    <div class="err" id="settingsSuccess" style="display:none; background:#E4F6EA; color:#1E7B3F; padding:10px 14px; border-radius:6px; font-size:13.5px; margin-bottom:16px;"></div>
    <form id="settingsForm">
      <div class="form-field">
        <label>كلمة المرور الحالية <span style="color:var(--rust);">*</span></label>
        <input type="password" id="currentPassword" required>
      </div>
      <div class="form-field">
        <label>اسم المستخدم الجديد (اتركه فارغًا إذا ما بدك تغييره)</label>
        <input type="text" id="newUsername">
      </div>
      <div class="form-field">
        <label>كلمة المرور الجديدة (اتركها فارغة إذا ما بدك تغييرها)</label>
        <input type="password" id="newPassword">
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">حفظ التغييرات</button>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
