<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الإدارة</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body{ background: var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card{
    background: var(--sand-2); width:100%; max-width:400px;
    padding:44px 38px; border-radius:12px; box-shadow: var(--shadow-lg);
  }
  .login-card .stamp-mini{ width:44px; height:44px; font-size:18px; margin:0 auto 18px; border-color:var(--gold); color:var(--gold); }
  .login-card h1{ text-align:center; font-size:22px; margin-bottom:6px; }
  .login-card p.sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:30px; }
  .err{ display:none; background:#FBE7E5; color:#B23A2C; padding:10px 14px; border-radius:6px; font-size:13.5px; margin-bottom:18px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo" style="justify-content:center;">
      <span class="stamp-mini">✈</span>
    </div>
    <h1>لوحة تحكم الإدارة</h1>
    <p class="sub">سجّل دخولك لمتابعة طلبات التأشيرة</p>

    <div class="err" id="loginErr">بيانات الدخول غير صحيحة</div>

    <form id="loginForm">
      <div class="form-field">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center;">تسجيل الدخول</button>
    </form>
  </div>

<script>
const API_BASE = 'https://backend-1-gysi.onrender.com';

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errBox = document.getElementById('loginErr');
    errBox.style.display = 'none';
    const fd = new FormData(e.target);

    try{
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'فشل تسجيل الدخول');

      sessionStorage.setItem('adminToken', data.token);
      sessionStorage.setItem('adminUsername', data.username);
      window.location.href = 'dashboard.html';
    } catch(err){
      errBox.textContent = err.message === 'Failed to fetch'
        ? 'تعذّر الاتصال بالسيرفر — تأكد أن الباك اند يعمل.'
        : err.message;
      errBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
